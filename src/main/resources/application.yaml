server:
  port: 8081
spring:
  application:
    name: hcfs
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hcfs?useSSL=false
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
#    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hcfs.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

# ============ 接口文档配置 (Knife4j + springdoc) ============
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.hcfs.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型
